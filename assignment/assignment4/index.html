<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>UX Review Blog</title>
</head>
<body>
    <div class="nav_and_hero">
        <div class="hero_shape1"></div>
        <div class="hero_shape2"></div>
        <div class="hero_shape3"></div>
        <div class="container">
            <nav class="nav">
                <div class="navbar_elements">
                    <div class="logo">
                        <h2>The UX <span>Review</span> </h2>
                    </div>
                    <div class="nav_links">
                        <ul>
                            <li><a href="#">HOME</a></li>
                            <li>
                                <img src="img/gray-star.png" alt="gray star">
                                <a href="#">LATEST ARTICLES</a>
                            </li>
                            <li>
                                <img src="img/gray-star.png" alt=" gray star">
                                <a href="#">AUTHORS</a>
                            </li>
                            <li>
                                <img src="img/gray-star.png" alt=" gray star">
                                <a href="#">COMMUNITY</a>
                            </li>
                        </ul>
                    </div>
                    <div class="nav_btn">
                        <button>
                            <a href="#">SUBSCRIBE NOW</a>
                        </button>
                    </div>
                </div>
            </nav>
        </div>
        <section class="hero_section">
            <div class="container">
                <div class="hero" id="hero">
                    
                    <div class="hero_content">
                        <div class="hero_trending">
                            <p>🔥 TRENDING NOW</p>
                        </div>
                        <div class="hero_header">
                            <h1> <span class="black"> BRUTAL </span> <br> <span class="red"> THOUGHTS </span> <br> <span class="blue">BOLD IDEAS</span></h1>
                            <p>Raw, unfiltered content about tech, design, and <br> culture. No sugar-coating, just pure truth that <br> hits different.</p>
                        </div>
                        <div class="hero_buttons">
                            <button class="btn1">
                                <img src="img/white-rocket.png" alt=" rocket">
                                START READING
                            </button>
                            <button class="btn2">
                                <img src="img/playIcon.svg" alt=" play">
                                Learn More
                            </button>
                        </div>
                    </div>
                    <div class="hero_img">
                        <div class="feature">
                            <p>FEATURED</p>
                        </div>
                        <img src="img/heroimg.png" alt=" hero image">
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
