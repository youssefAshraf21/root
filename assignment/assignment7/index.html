    <!-- font awesome  -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- link the font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Cairo:wght@200..1000&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Exo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jomhuria&family=Lobster&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/syle.css">
    <title>What's For Dinner</title>

<body >

<header>
    <nav class="navbar navbar-expand-lg bg-white">
    <div class="container">
        <div class="d-flex align-items-center gap-3">

            <a class="navbar-brand m-0" href="#">
                <img src="img/logo.png" class="rounded-circle" alt="logo" width="50" height="50">
            </a>
            <div class="logo_title">
                <h1 class="fw-bold fs-4 mb-0">What's For Dinner</h1>
                <p class="mb-0">Your daily meal inspiration</p>
            </div>
        </div>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">

        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="d-flex gap-4 align-items-center ms-auto">
                <i class="fa-solid fa-bookmark fs-5 text-secondary"></i>
                <i class="fa-solid fa-clock-rotate-left fs-5 text-secondary"></i>
                <i class="fa-solid fa-gear fs-5 text-secondary"></i>
                <div class="bg-dark rounded-circle p-1">
                    <img src="img/avatar1.jpg"
                    class="img-fluid rounded-circle border border-2 border-warning"
                    width="40"
                    height="40"
                    alt="">
                </div>
            </div>
        </div>
    </div>

<script src="js/bootstrap.bundle.min.js"></script>
