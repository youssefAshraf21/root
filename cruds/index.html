<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon.png">
    <!-- font awesome  -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- link the font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- bootstarp -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- main style sheet -->
    <link rel="stylesheet" href="css/syle.css">
    <title>Store Management System</title>
</head>
<body class="bg-light">

    <header class="text-bg-primary text-center p-3 header">
        <h1 class="fw-bold display-4">Store Management System</h1>
        <p class="fs-5 fw-light">Efficiently manage your product inventory</p>
    </header>

    <main>
        <section class="container mt-5 bg-white p-3 shadow px-0">
            <div class="section_header d-flex justify-content-start align-items-center gap-2 text-primary  border-bottom border-2 p-3">
                <i class="fas fa-plus-circle fs-4"></i>
                <h2 class="m-0">Add New Product</h2>
            </div>
            <form>
                <div class="container mt-4">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input id="productName" type="text" class="form-control" id="productName" placeholder="product Name">
                                <label for="productName"><i class="fa-solid fa-tag"></i> Product Name</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input id="productPrice" type="number" class="form-control" id="productPrice" placeholder="product Name">
                                <label for="productPrice"><i class="fa-solid fa-dollar"></i> Product Price</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input id="productCategory" list="prodCat" class="form-control" id="productCategory" placeholder="product Category">
                                <label for="productCategory"><i class="fa-solid fa-table-cells-large"></i> Product Category</label>
                                <datalist id="prodCat">
                                    <option value="TV"></option>
                                    <option value="Mobile"></option>
                                    <option value="Laptop"></option>
                                </datalist>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="file" class="form-control" id="productImage" placeholder="product Image">
                                <label for="productImage" class=""><i class="fa-regular fa-image"></i> Product Image</label>
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <div class="form-floating mb-3">
                                <textarea id="productDescription" type="number" class="form-control" id="productDescription" placeholder="product Description"></textarea>
                                <label for="productDescription"><i class="fa-solid fa-align-center"></i> Product Description</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center px-3">
                        <button onclick="addProduct()" type="button" class="btn btn-primary"><i class="fas fa-plus-circle me-2"></i>Add Product</button>
                        <input type="search" placeholder="Search Product" class="form-control w-50 border border-2 rounded-3">
                    </div>
                </div>
            </form>
        </section>
        <section>
            <div class="container py-5">
                <div class="section_header d-flex justify-content-between align-items-center gap-2 text-black p-3 mt-5">
                    <div class="d-flex justify-content-start align-items-center gap-2">
                        <i class="fa-solid fa-table-cells-large fs-4"></i>
                        <h2 class="m-0">Product Inventory</h2>
                    </div>
                    <span class="fw-bold text-bg-primary p-2 rounded-2">3 product</span>
                </div>
                <div class="row g-3" id="productCards">
                    
                </div>
            </div>
        </section>
    </main>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
